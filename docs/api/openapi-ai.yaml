openapi: 3.0.3
info:
  title: OpsPilot AI Service (internal)
  version: 1.0.0
  description: |
    Go → Python 内部契约。语义以 `docs/api/ingest-contract.md` v1.1 为准，本文件只做机器可读转写。

    约定：
    - 所有 `/internal/**` 端点必须带 `X-Internal-Token`；`/health/**` 豁免。
    - 业务失败用 200 + 结构化结果返回（`status=failed/stale`），不用 5xx 表达可预期的业务失败。
    - 不提供 abort 端点（决策 Q2：统一由 Go watchdog 收尾）。
    - 状态：已冻结（2026-10-22 S2 审查通过）。仅允许实测结果触发修改。

servers:
  - url: http://ai-service:8000
    description: compose 内网

security:
  - internalToken: []

paths:
  /internal/v1/ingest:
    post:
      summary: 执行摄取（解析/切片/Embedding/写不可见切片）
      description: |
        Python **不得**写 `ingest_jobs`；只返回结果。切片写入时必须 `visible=false` 且带 `run_token`。
        `chunk_count=0` 由 Go 侧拒绝发布并置 `failed(EMPTY_CONTENT)`，Python 无需自行判断。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '200':
          description: 结构化结果（成功/失败/过期均为 200）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidIngestRequest'
        '503':
          $ref: '#/components/responses/DbUnavailable'

  /internal/v1/documents/{doc_id}/vectors:
    delete:
      summary: 按 doc_id 清理全部切片（含 visible=false 与所有世代）
      parameters:
        - name: doc_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 幂等；无切片时 deleted_chunks=0
          content:
            application/json:
              schema:
                type: object
                required: [doc_id, deleted_chunks]
                properties:
                  doc_id: { type: string, format: uuid }
                  deleted_chunks: { type: integer, minimum: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/DbUnavailable'

  /health/live:
    get:
      summary: 进程存活
      security: []
      responses:
        '200':
          description: 永远 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthLive' }

  /health/ready:
    get:
      summary: 依赖就绪
      security: []
      responses:
        '200':
          description: 依赖全部可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReady' }
        '503':
          description: 任一依赖不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReady' }

  /health/deps:
    get:
      summary: 依赖明细（不含任何密钥）
      security: []
      responses:
        '200':
          description: 明细
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthDeps' }

  /internal/v1/chat:
    post:
      summary: 非流式执行一轮问答（Turn）
      description: |
        Go 调用 Python 编排的入口。`emit=None` 执行 `run_turn`，返回完整 `TurnResult`。
        业务失败（如模型不可用）用 200 + 结构化结果表达；5xx 仅用于不可预期的内部错误。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurnRequest' }
      responses:
        '200':
          description: 完整结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidIngestRequest'
        '503':
          $ref: '#/components/responses/DbUnavailable'

  /internal/v1/chat/stream:
    post:
      summary: 流式执行一轮问答（SSE）
      description: |
        与 `/internal/v1/chat` 共用同一 `run_turn` 实现；通过 `emit` 回调逐条输出事件。
        事件类型：`meta` / `delta` / `citation` / `done` / `error`。
        - `citation` 在 final 之后一次性发出，不在流中插入半截引用。
        - 正常结束必须发 `done`；异常结束发 `error` 后关闭，禁止静默断流。
        - 客户端断开：停止生成、落 `terminated_reason=client_disconnected`、不再发起新 LLM 调用。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurnRequest' }
      responses:
        '200':
          description: SSE 流（每条事件 `data:` 为 JSON）
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  data: {"type":"meta","run_id":"…","session_id":"…","request_id":"…"}
                  data: {"type":"delta","text":"…"}
                  data: {"type":"citation","citations":[…]}
                  data: {"type":"done","usage":{"llm_calls":2,"tool_calls":0}}
                  data: {"type":"error","code":"MODEL_UNAVAILABLE","message":"…"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidIngestRequest'
        '503':
          $ref: '#/components/responses/DbUnavailable'

components:
  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 与 `AI_SERVICE_TOKEN` 常量时间比较；缺失或错误一律 401，不区分原因。

  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
      description: 与 Go 侧 request_id 一致，用于跨服务串联。

  responses:
    Unauthorized:
      description: 内部令牌缺失或错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidIngestRequest:
      description: 请求缺字段
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DbUnavailable:
      description: 数据库不可用
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    IngestRequest:
      type: object
      required: [job_id, doc_id, run_token, attempt]
      properties:
        job_id: { type: string, format: uuid }
        doc_id: { type: string, format: uuid }
        run_token:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: 32 位小写 hex，由 Go 抢占时生成。
        attempt:
          type: integer
          minimum: 1
          description: 已执行次数（建行 0，抢占 +1，故本次执行从 1 开始）。

    IngestResult:
      type: object
      required: [run_token, status]
      properties:
        run_token:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: 原样回带请求中的 token；Go 用它与 `current_run_token` 做 CAS。
        status:
          type: string
          enum: [ok, failed, stale]
        chunk_count:
          type: integer
          minimum: 0
          description: status=ok 时必填；为 0 时 Go 拒绝发布。
        error_code:
          type: string
          description: status=failed 时必填
          enum: [PARSE_ERROR, EMPTY_CONTENT, EMBEDDING_FAILED, RATE_LIMITED, DB_ERROR, TIMEOUT]
        message:
          type: string
          maxLength: 500

    HealthLive:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, example: ops-pilot-ai }
        version: { type: string }
        time: { type: string, format: date-time }

    HealthReady:
      type: object
      required: [ready, checks]
      properties:
        ready: { type: boolean }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [up, down] }
              latency_ms: { type: integer }

    HealthDeps:
      type: object
      properties:
        db:
          type: object
          properties:
            status: { type: string, enum: [up, down, not_run] }
            latency_ms: { type: integer }
        llm:
          type: object
          properties:
            status: { type: string, enum: [up, down, not_run] }
            model: { type: string }
            latency_ms: { type: integer }
        embedding:
          type: object
          properties:
            status: { type: string, enum: [up, down, not_run] }
            model: { type: string }
            dim: { type: integer, example: 1024 }
            latency_ms: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [INTERNAL_AUTH_FAILED, INVALID_INGEST_REQUEST, DB_UNAVAILABLE]
            message: { type: string }
            request_id: { type: string }

    TurnRequest:
      type: object
      required: [request_id, session_id, turn_index, question]
      properties:
        request_id:
          type: string
          maxLength: 128
          description: 与 Go 侧 X-Request-Id 一致，用于跨服务串联。
        session_id:
          type: string
          format: uuid
        turn_index:
          type: integer
          minimum: 0
          description: 当前轮次，从 0 开始。
        question:
          type: string
          minLength: 1
          maxLength: 500
        history:
          type: array
          maxItems: 8
          description: 最近 4 轮 / 8 条，按时间升序。
          items: { $ref: '#/components/schemas/HistoryMessage' }
        attach_log:
          type: string
          maxLength: 8192
          description: 可选，随问题一起提交的日志文本（供 analyze_error_log 使用）。
        owner_id:
          type: string
          description: |
            资源归属者（内部扩展字段，B3 登记）。
            FR-16 要求检索按 owner_id 过滤，该值由 Go 从 JWT 上下文派生并随载荷传入；
            对外必填项仍以 request_id/session_id/turn_index/question 为准。

    HistoryMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content: { type: string }

    TurnResult:
      type: object
      required: [run_id, session_id, route, final_text, answer_type, degraded, terminated_reason, usage, duration_ms]
      properties:
        run_id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        route:
          type: string
          enum: [kb_qa, troubleshooting, smalltalk, out_of_scope]
        final_text: { type: string }
        answer_type:
          type: string
          enum: [answered, refusal, clarify, smalltalk, out_of_scope, degraded]
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        degraded: { type: boolean }
        degrade_reasons:
          type: array
          items: { type: string }
        preempted:
          type: array
          items: { type: string }
        terminated_reason:
          type: string
          enum: [completed, budget_exhausted, deadline_exceeded, step_limit, client_disconnected]
        usage: { $ref: '#/components/schemas/Usage' }
        duration_ms: { type: integer, minimum: 0 }

    Citation:
      type: object
      required: [chunk_id, doc_id, doc_title, snippet, status]
      properties:
        chunk_id: { type: string, format: uuid }
        doc_id: { type: string, format: uuid }
        doc_title: { type: string }
        snippet: { type: string, maxLength: 200 }
        score: { type: number, minimum: 0, maximum: 1 }
        source_type:
          type: string
          enum: [kb, tool, log]
        tool_call_id:
          type: string
          description: source_type=tool/log 时指向具体工具调用。
        status:
          type: string
          enum: [live, deleted, orphaned]
          description: live=原文可取；deleted=原文已删仅剩快照；orphaned=快照也缺失。

    Usage:
      type: object
      required: [llm_calls, tool_calls]
      properties:
        llm_calls: { type: integer, minimum: 0 }
        tool_calls: { type: integer, minimum: 0 }
        prompt_tokens: { type: integer, minimum: 0 }
        completion_tokens: { type: integer, minimum: 0 }

    ChatEvent:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [meta, delta, citation, done, error]
        run_id:
          type: string
          format: uuid
          description: type=meta/done/error 时出现。
        session_id:
          type: string
          format: uuid
          description: type=meta 时出现。
        request_id:
          type: string
          description: type=meta/error 时出现。
        text:
          type: string
          description: type=delta 时出现。
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
          description: type=citation 时出现。
        usage:
          $ref: '#/components/schemas/Usage'
          description: type=done 时出现。
        code:
          type: string
          description: type=error 时出现。
        message:
          type: string
          description: type=error 时出现。
