services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ops_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-ops_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - opspilot_pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops_pilot} -d ${POSTGRES_DB:-ops_pilot}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - opspilot

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
    container_name: opspilot-ai
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_PORT: ${AI_PORT:-8000}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ops_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-ops_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL_ROUTER: ${LLM_MODEL_ROUTER:-qwen-flash}
      LLM_MODEL_QA: ${LLM_MODEL_QA:-qwen-plus}
      LLM_MODEL_TROUBLESHOOT: ${LLM_MODEL_TROUBLESHOOT:-qwen-plus}
      LLM_MODEL_CHECKER: ${LLM_MODEL_CHECKER:-qwen-plus}
      LLM_MODEL_FINAL: ${LLM_MODEL_FINAL:-qwen-plus}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 代理默认放空；若宿主需翻墙可在 deploy/.env 中设置 host.docker.internal:7890
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      NO_PROXY: ${NO_PROXY:-postgres,ai-service,backend,localhost,127.0.0.1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # 本地验收脚本（脚本在宿主机运行）需要直连内部 ingest 接口；
      # 生产部署可去掉该映射，仅走 compose 内网。
      - "${AI_PORT:-8000}:8000"
    networks:
      - opspilot
    # 默认仅内网暴露；如需宿主直连验收，用上方 AI_PORT 映射

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        # 版本信息注入（清 S3 挂账）；未传时 Dockerfile 默认 dev/unknown
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: opspilot-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_PORT: ${APP_PORT:-8081}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ops_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-ops_pilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      ENABLE_DEV_AUTH: ${ENABLE_DEV_AUTH:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      NO_PROXY: ${NO_PROXY:-postgres,ai-service,backend,localhost,127.0.0.1}
    ports:
      - "${APP_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - opspilot

volumes:
  opspilot_pg_data:

networks:
  opspilot:
    driver: bridge
